<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>속도 측정기</title>
    <style>
        body { font-family: Arial; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f0f0f0; }
        .container { background: white; padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        #speed { font-size: 80px; font-weight: bold; color: #1abc9c; margin: 20px 0; }
        #info { font-size: 14px; color: #666; margin: 10px 0; }
        button { padding: 15px 40px; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; margin: 10px; font-weight: bold; }
        #startBtn { background: #3498db; color: white; }
        #stopBtn { background: #e74c3c; color: white; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ 속도 측정기</h1>
        <div id="speed">0.0 km/h</div>
        <div id="info">-</div>
        <button id="startBtn">측정 시작</button>
        <button id="stopBtn">측정 중지</button>
    </div>

    <script>
        let watchId = null;
        const speedEl = document.getElementById('speed');
        const infoEl = document.getElementById('info');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        startBtn.onclick = () => {
            watchId = navigator.geolocation.watchPosition(pos => {
                const speed = (pos.coords.speed || 0) * 3.6;
                const accuracy = pos.coords.accuracy.toFixed(1);
                speedEl.textContent = speed.toFixed(1) + ' km/h';
                infoEl.textContent = `오차: ±${accuracy}m`;
            });
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline';
        };

        stopBtn.onclick = () => {
            navigator.geolocation.clearWatch(watchId);
            speedEl.textContent = '0.0 km/h';
            infoEl.textContent = '-';
            startBtn.style.display = 'inline';
            stopBtn.style.display = 'none';
        };
    </script>
</body>
</html>
