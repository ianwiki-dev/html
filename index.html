<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고정밀 실시간 지도 추적</title>
    <!-- 오픈소스 지도 라이브러리 Leaflet CSS 추가 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f0f4f8;
        }
        
        #info-panel {
            background: white;
            padding: 12px 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 1000;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            align-items: center;
        }
        
        .status-badge {
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            background-color: #6c757d;
            color: white;
            text-align: center;
            grid-column: 1 / -1;
        }
        
        .tracking { background-color: #28a745; }
        .waiting { background-color: #ffc107; color: #333; }
        .error { background-color: #dc3545; }
        
        .data-item {
            font-size: 13px;
            padding: 4px 8px;
            background-color: #f8f9fa;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .data-label {
            color: #666;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .data-value {
            font-weight: bold;
            color: #333;
            font-size: 14px;
            font-family: 'Monaco', 'Courier New', monospace;
        }

        #map {
            flex: 1;
            width: 100%;
        }
        
        .button-group {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }
        
        button {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        #stopBtn {
            background-color: #dc3545;
            color: white;
        }
        
        #stopBtn:hover {
            background-color: #c82333;
        }
        
        #stopBtn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        /* 모바일 반응형 */
        @media (max-width: 600px) {
            #info-panel {
                grid-template-columns: 1fr;
                gap: 8px;
                padding: 10px 12px;
            }
            
            .status-badge {
                grid-column: 1 / -1;
            }
            
            .data-item {
                font-size: 12px;
            }
            
            .button-group {
                grid-column: 1 / -1;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

<!-- 상단 정보창 -->
<div id="info-panel">
    <div id="status" class="status-badge waiting">GPS 연결 대기 중</div>
    <div class="data-item">
        <span class="data-label">위도</span>
        <span id="lat" class="data-value">-</span>
    </div>
    <div class="data-item">
        <span class="data-label">경도</span>
        <span id="lon" class="data-value">-</span>
    </div>
    <div class="data-item">
        <span class="data-label">오차범위</span>
        <span id="accuracy" class="data-value">-</span>
    </div>
    <div class="data-item">
        <span class="data-label">속도</span>
        <span id="speed" class="data-value">-</span>
    </div>
    <div class="button-group">
        <button id="stopBtn" disabled>추적 중지</button>
    </div>
</div>

<!-- 실시간 지도가 그려질 영역 -->
<div id="map"></div>

<!-- 오픈소스 지도 라이브러리 Leaflet JS 추가 -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// 고정밀 위치 서비스 옵션
const geoOptions = {
    enableHighAccuracy: true, // ⭐ 하드웨어 GPS 강제 활성화
    timeout: 10000,
    maximumAge: 0            // 캐시 데이터 사용 금지
};

let map, marker, circle;
let isMapInitialized = false;
let watchId = null;
let isTracking = false;

function startTracking() {
    const statusBadge = document.getElementById("status");
    const stopBtn = document.getElementById("stopBtn");

    if (navigator.geolocation) {
        // 실시간으로 위치 변화를 감시 (걸어가거나 차를 타면 실시간 업데이트)
        watchId = navigator.geolocation.watchPosition(
            updateLocation,
            showError,
            geoOptions
        );
        isTracking = true;
        stopBtn.disabled = false;
        statusBadge.innerText = "실시간 위치 추적 중";
        statusBadge.className = "status-badge tracking";
    } else {
        statusBadge.innerText = "GPS 미지원 브라우저";
        statusBadge.className = "status-badge error";
    }
}

function stopTracking() {
    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }
    
    isTracking = false;
    const statusBadge = document.getElementById("status");
    const stopBtn = document.getElementById("stopBtn");
    
    statusBadge.innerText = "추적 중지됨";
    statusBadge.className = "status-badge";
    stopBtn.disabled = true;
}

function updateLocation(position) {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;
    const accuracy = position.coords.accuracy;
    const speed = position.coords.speed;

    // 1. 텍스트 데이터 업데이트
    document.getElementById("lat").innerText = lat.toFixed(6);
    document.getElementById("lon").innerText = lon.toFixed(6);
    document.getElementById("accuracy").innerText = `±${accuracy.toFixed(1)}m`;
    
    // 속도 안전하게 계산 (null, 음수 체크)
    if (speed !== null && speed >= 0) {
        document.getElementById("speed").innerText = `${(speed * 3.6).toFixed(1)} km/h`;
    } else {
        document.getElementById("speed").innerText = "0.0 km/h";
    }

    // 2. 지도 및 마커 업데이트
    if (!isMapInitialized) {
        // 처음 위치를 잡았을 때 지도를 생성하고 중심점을 맞춤 (줌 레벨 17)
        map = L.map('map').setView([lat, lon], 17);

        // OpenStreetMap 타일 이미지(지도 그래픽) 로드
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        // 내 위치를 나타낼 마커 추가
        marker = L.marker([lat, lon], {
            title: "내 위치"
        }).addTo(map).bindPopup("<b>📍 내가 지금 있는 곳!</b>").openPopup();
        
        // 오차 범위를 보여주는 반경 원 추가
        circle = L.circle([lat, lon], {
            radius: accuracy,
            color: '#007bff',
            fillColor: '#0d6efd',
            fillOpacity: 0.2,
            weight: 2
        }).addTo(map);

        isMapInitialized = true;
    } else {
        // 움직여서 새로운 좌표가 들어오면 마커와 오차 반경 원의 위치를 부드럽게 이동시킴
        const newLatLng = new L.LatLng(lat, lon);
        marker.setLatLng(newLatLng);
        circle.setLatLng(newLatLng);
        circle.setRadius(accuracy); // 오차범위 변동 반영
        
        // 내가 움직일 때 지도 중심도 나를 따라오게 설정
        map.setView(newLatLng);
    }
}

function showError(error) {
    const statusBadge = document.getElementById("status");
    statusBadge.className = "status-badge error";
    
    let message = "오류 발생";
    
    switch(error.code) {
        case error.PERMISSION_DENIED:
            message = "위치 권한 거부됨";
            alert("상단 주소창 옆의 자물쇠 아이콘을 눌러 위치 권한을 '허용'해 주세요.");
            break;
        case error.POSITION_UNAVAILABLE:
            message = "위치 확인 불가";
            break;
        case error.TIMEOUT:
            message = "요청 시간 초과";
            break;
        default:
            message = "알 수 없는 오류";
    }
    
    statusBadge.innerText = message;
}

// 이벤트 리스너
document.getElementById("stopBtn").addEventListener("click", stopTracking);

// 웹페이지 로드 시 즉시 실행
window.addEventListener("load", startTracking);
</script>

</body>
</html>
