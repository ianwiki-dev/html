<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>속도 측정기</title>
<body>
    <div class="container">
        <h1>⚡ 속도 측정기</h1>
        <div id="speed">0.0 km/h</div>
        <div id="info">-</div>
        <button id="startBtn">측정 시작</button>
        <button id="stopBtn">측정 중지</button>
    </div>

    <script>
        let watchId = null;
        const speedEl = document.getElementById('speed');
        const infoEl = document.getElementById('info');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        startBtn.onclick = () => {
            watchId = navigator.geolocation.watchPosition(pos => {
                const speed = (pos.coords.speed || 0) * 3.6;
                const accuracy = pos.coords.accuracy.toFixed(1);
                speedEl.textContent = speed.toFixed(1) + ' km/h';
                infoEl.textContent = `오차: ±${accuracy}m`;
            });
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline';
        };

        stopBtn.onclick = () => {
            navigator.geolocation.clearWatch(watchId);
            speedEl.textContent = '0.0 km/h';
            infoEl.textContent = '-';
            startBtn.style.display = 'inline';
            stopBtn.style.display = 'none';
        };
    </script>
</body>
</html>
