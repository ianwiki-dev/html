<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고정밀 실시간 지도 추적</title>
    <!-- 오픈소스 지도 라이브러리 Leaflet CSS 추가 -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f0f4f8;
        }
        #info-panel {
            background: white;
            padding: 15px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 1000; /* 지도가 위에 올라오지 않도록 정렬 */
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
        }
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            background-color: #6c757d;
            color: white;
        }
        .tracking { background-color: #28a745; }
        .error { background-color: #dc3545; }
        
        .data-item {
            font-size: 16px;
            margin: 5px 15px;
        }
        .data-label { color: #666; font-size: 13px; margin-right: 5px;}
        .data-value { font-weight: bold; color: #333; }

        /* 지도 영역 설정 (전체 화면의 남은 부분을 채움) */
        #map {
            flex: 1;
            width: 100%;
        }
    </style>
</head>
<body>

<!-- 상단 정보창 -->
<div id="info-panel">
    <div id="status" class="status-badge">GPS 연결 대기 중</div>
    <div class="data-item"><span class="data-label">위도:</span><span id="lat" class="data-value">-</span></div>
    <div class="data-item"><span class="data-label">경도:</span><span id="lon" class="data-value">-</span></div>
    <div class="data-item"><span class="data-label">오차범위:</span><span id="accuracy" class="data-value">-</span></div>
    <div class="data-item"><span class="data-label">속도:</span><span id="speed" class="data-value">-</span></div>
</div>

<!-- 실시간 지도가 그려질 영역 -->
<div id="map"></div>

<!-- 오픈소스 지도 라이브러리 Leaflet JS 추가 -->
<script src="https://unpkg.com"></script>
<script>
// 고정밀 위치 서비스 옵션
const geoOptions = {
    enableHighAccuracy: true, // ⭐ 하드웨어 GPS 강제 활성화
    timeout: 10000,
    maximumAge: 0            // 캐시 데이터 사용 금지
};

let map, marker, circle;
let isMapInitialized = false;

function startTracking() {
    const statusBadge = document.getElementById("status");

    if (navigator.geolocation) {
        // 실시간으로 위치 변화를 감시 (걸어가거나 차를 타면 실시간 업데이트)
        navigator.geolocation.watchPosition(updateLocation, showError, geoOptions);
        statusBadge.innerText = "실시간 위치 추적 중";
        statusBadge.className = "status-badge tracking";
    } else {
        statusBadge.innerText = "GPS 미지원 브라우저";
        statusBadge.className = "status-badge error";
    }
}

function updateLocation(position) {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;
    const accuracy = position.coords.accuracy;
    const speed = position.coords.speed;

    // 1. 텍스트 데이터 업데이트
    document.getElementById("lat").innerText = lat.toFixed(6);
    document.getElementById("lon").innerText = lon.toFixed(6);
    document.getElementById("accuracy").innerText = `±${accuracy.toFixed(1)}m`;
    
    if (speed !== null && speed > 0) {
        document.getElementById("speed").innerText = `${(speed * 3.6).toFixed(1)} km/h`;
    } else {
        document.getElementById("speed").innerText = "0.0 km/h";
    }

    // 2. 지도 및 마커 업데이트
    if (!isMapInitialized) {
        // 처음 위치를 잡았을 때 지도를 생성하고 중심점을 맞춤 (줌 레벨 17)
        map = L.map('map').setView([lat, lon], 17);

        // OpenStreetMap 타일 이미지(지도 그래픽) 로드
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 내 위치를 나타낼 마커 추가
        marker = L.marker([lat, lon]).addTo(map).bindPopup("<b>내가 지금 있는 곳!</b>").openPopup();
        
        // 오차 범위를 보여주는 반경 원 추가
        circle = L.circle([lat, lon], { radius: accuracy, color: '#007bff', opacity: 0.3 }).addTo(map);

        isMapInitialized = true;
    } else {
        // 움직여서 새로운 좌표가 들어오면 마커와 오차 반경 원의 위치를 부드럽게 이동시킴
        const newLatLng = new L.LatLng(lat, lon);
        marker.setLatLng(newLatLng);
        circle.setLatLng(newLatLng);
        circle.setRadius(accuracy); // 오차범위 변동 반영
        
        // 내가 움직일 때 지도 중심도 나를 따라오게 설정
        map.setView(newLatLng);
    }
}

function showError(error) {
    const statusBadge = document.getElementById("status");
    statusBadge.className = "status-badge error";
    
    switch(error.code) {
        case error.PERMISSION_DENIED:
            statusBadge.innerText = "권한 거부됨";
            alert("상단 주소창 옆의 자물쇠 아이콘을 눌러 위치 권한을 '허용'해 주세요.");
            break;
        case error.POSITION_UNAVAILABLE:
            statusBadge.innerText = "위치 확인 불가";
            break;
        case error.TIMEOUT:
            statusBadge.innerText = "요청 시간 초과";
            break;
        default:
            statusBadge.innerText = "오류 발생";
            break;
    }
}

// 웹페이지 로드 시 즉시 실행
window.onload = startTracking;
</script>

</body>
</html>
